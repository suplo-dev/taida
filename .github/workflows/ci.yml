name: CI

on:
  pull_request:
  # Lets deploy.yml gate on the same suite instead of duplicating it. There is
  # deliberately no `push: main` trigger: deploy.yml already runs on that push
  # and calls this workflow, and both runs land in the same concurrency group,
  # so the standalone one was cancelled within two seconds every single time.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same PHP as the shared hosting. `composer.json` only asks for `^8.3`, but
  # testing at that floor means neither CI nor any dev machine runs the version
  # production runs — and whatever changed between 8.3 and 8.5 (deprecations,
  # edge-case behaviour) would only surface on the server. deploy.yml builds
  # `vendor/` with this same value: composer resolves dependencies against the
  # version used HERE, not the one on the server, so a mismatch skews the whole
  # dependency tree.
  #
  # Changing PHP on hosting means changing it in both places (ci.yml + deploy.yml).
  PHP_VERSION: '8.5'
  NODE_VERSION: '22'
  PNPM_VERSION: '10'

jobs:
  api:
    name: Laravel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          # `zip` is not used by the app: composer needs it to unpack `--prefer-dist`
          # archives itself instead of shelling out to `unzip` for every package.
          extensions: mbstring, pdo_sqlite, gd, fileinfo, intl, zip
          coverage: none
          tools: composer:v2

      - name: Cache composer packages
        uses: actions/cache@v6
        with:
          path: be/vendor
          key: composer-${{ hashFiles('be/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        working-directory: be
        run: composer install --prefer-dist --no-interaction --no-progress

      # phpunit.xml pins the suite to sqlite :memory:, so no database service
      # is needed — but APP_KEY is still required to boot the app.
      - name: Prepare environment
        working-directory: be
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check formatting
        working-directory: be
        run: vendor/bin/pint --test

      # Hai script này chạy TRÊN HOSTING, ngoài tầm với của mọi test. Chúng vỡ thì
      # deploy vẫn báo xong — chỉ lặng lẽ rơi về đường lui đẩy từng file (chậm gấp
      # hàng chục lần), hoặc tệ hơn, migration không bao giờ chạy và API mới đứng
      # trên database cũ. Một lượt `php -l` là thứ duy nhất bắt được chuyện đó sớm.
      - name: Check the deploy scripts
        run: |
          php -l deploy/shared-hosting/unpack.php
          php -l deploy/shared-hosting/artisan.php

      - name: Run tests
        working-directory: be
        run: php artisan test

  web:
    name: Nuxt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The site is statically generated, so the build reads every page out of
      # the API and writes it to disk. That makes a running API part of the
      # build toolchain: without one there is nothing to check, and a broken
      # endpoint or a record missing a translation would only surface on the
      # server. sqlite keeps it to one process with no service container.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo_sqlite, gd, fileinfo, intl, zip
          coverage: none
          tools: composer:v2

      - name: Start the API
        working-directory: be
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          {
            echo "DB_CONNECTION=sqlite"
            echo "DB_DATABASE=$PWD/database/database.sqlite"
            echo "FRONTEND_URLS=http://127.0.0.1:3000"
          } >> .env
          php artisan migrate --force --seed
          php artisan serve --host=127.0.0.1 --port=8000 &
          # Fail fast and loudly rather than let the build time out crawling.
          for _ in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:8000/api/v1/ping && exit 0
            sleep 1
          done
          echo "::error::API did not come up"; exit 1

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: fe/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: fe
        run: pnpm install --frozen-lockfile

      # Lint và typecheck chạy TRƯỚC generate: chúng mất vài chục giây và nói rõ
      # sai ở dòng nào, còn generate mất vài phút và một lỗi kiểu chỉ hiện ra dưới
      # dạng trang dựng thiếu nội dung — nếu nó hiện ra chút nào.
      #
      # `pnpm lint` chỉ đỏ vì error; warning (v-html của nội dung CMS) vẫn in ra để
      # đọc mà không chặn ai cả.
      - name: Lint
        working-directory: fe
        run: pnpm lint

      - name: Typecheck
        working-directory: fe
        run: pnpm typecheck

      # `prerender.failOnError` is on, so this fails on any page that 404s
      # during the crawl — which is how the broken language switcher was found.
      #
      # `pnpm generate` ghim `--dotenv .env.production`, và file đó KHÔNG có trong
      # git. Biến môi trường đặt sẵn ở đây thắng nội dung file dotenv, nên bước này
      # trỏ vào API sqlite dựng ở trên dù máy dev có file đó trỏ đi đâu.
      - name: Generate the static site
        working-directory: fe
        env:
          NUXT_PUBLIC_API_BASE: http://127.0.0.1:8000
          NUXT_PUBLIC_SITE_URL: https://www.taida.vn
        run: pnpm generate

      - name: Check the output
        working-directory: fe
        run: |
          set -e
          test -f .output/public/index.html
          test -f .output/public/en/index.html
          test -f .output/public/zh/index.html
          test -f .output/public/sitemap.xml
          # Pre-compressed variants are what static hosting serves. Missing them
          # costs about six times the transfer size, and nothing else notices.
          test -f .output/public/index.html.br
          # Deploy uploads the contents of `.output/public/` into the document
          # root, so the Apache config reaches hosting only if generate copied it
          # out of `fe/public/`. Without it there is no SPA fallback and no
          # compression, which is exactly what deploy.yml's smoke test trips on.
          # (`fe/.htaccess` is a note for whoever sets the document root, not
          # config — it never serves anything.)
          test -f .output/public/.htaccess
          cmp public/.htaccess .output/public/.htaccess
          # Exactly one inside the build. A second one in a subdirectory would
          # override the rules above for that subtree instead of adding to them,
          # which is how the source directory ended up publicly readable.
          test "$(find .output/public -name .htaccess | wc -l)" -eq 1
          # Khu quản trị chỉ tồn tại trong trình duyệt: `.htaccess` viết lại mọi
          # `/admin/...` thành `/200.html`. Thiếu một trong hai file này thì mỗi lần
          # F5 trong CMS là một trang 404 — mà bản build vẫn đủ số trang để qua các
          # kiểm tra ở trên.
          test -f .output/public/admin/index.html
          test -f .output/public/200.html
          # Ngưỡng sàn, không phải con số chính xác: dữ liệu seed hiện sinh ~124
          # trang cho ba ngôn ngữ. Nó bắt trường hợp crawl chết sớm và bản build
          # ra vài trang gốc — thứ mà mọi kiểm tra ở trên vẫn cho qua.
          pages=$(find .output/public -name index.html | wc -l)
          echo "Generated $pages pages"
          test "$pages" -gt 100

          # Ba ngôn ngữ phải cùng dựng. Thiếu hẳn một bản thì tổng số trang vẫn
          # qua ngưỡng trên, nên phải đếm riêng.
          for locale in en zh; do
            count=$(find ".output/public/$locale" -name index.html | wc -l)
            echo "  $locale: $count pages"
            test "$count" -gt 10
          done

          # Sitemap chỉ khai bản dịch THẬT: một trang tiếng Trung chưa dịch vẫn
          # xem được (nội dung rơi về tiếng Việt) nhưng phải mang noindex, và hai
          # thứ đó phải nói cùng một điều. Xem useLocalisedSlugs.ts.
          for url in $(grep -o '<loc>[^<]*</loc>' .output/public/sitemap.xml | sed -e 's|<loc>||g' -e 's|</loc>||g'); do
            path="${url#*//*/}"
            [ "$path" = "$url" ] && path=''
            file=".output/public/${path:+$path/}index.html"
            [ -f "$file" ] || { echo "::error::sitemap khai $url nhưng bản build không có $file"; exit 1; }
            if grep -q 'name="robots" content="noindex' "$file"; then
              echo "::error::$url vừa nằm trong sitemap vừa mang noindex"
              exit 1
            fi
          done

          # A page whose API call failed still gets written to disk: useAsyncData
          # keeps the error in the payload's `_errors` instead of throwing, so
          # `failOnError` stays quiet and nitro reports "Total errors: 0". The
          # page count above passes too — the page exists, it is just empty of
          # everything the API was supposed to fill in. The serialised error is
          # the only trace, and a clean build carries no "NuxtError" anywhere.
          broken=$(grep -rl 'NuxtError' .output/public --include='*.html' || true)
          if [ -n "$broken" ]; then
            echo "::error::These pages rendered with a failed API call:"
            echo "$broken"
            grep -rhoa '\[GET\][^,]*' .output/public --include='*.html' | sort -u | head
            exit 1
          fi
