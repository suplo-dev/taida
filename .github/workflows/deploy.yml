name: Publish site

# Chạy tay là chính. Site tĩnh nên nội dung biên tập viên vừa sửa chỉ lên khi
# build lại — bấm "Run workflow" ở tab Actions là đủ, không cần lập trình viên.
on:
  workflow_dispatch:
  push:
    branches: [main]

# Hai lần publish chồng nhau sẽ ghi đè lẫn nhau giữa chừng khi upload, và
# tranh nhau ghi file trạng thái đồng bộ trên hosting.
concurrency:
  group: publish-production
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Build & upload
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: fe/pnpm-lock.yaml

      # Khác với bản SSR trước đây, output chỉ là HTML/CSS/JS — không kèm binary
      # `sharp`, nên không còn ràng buộc phải build đúng kiến trúc máy chủ.
      #
      # Đổi lại, build đọc nội dung từ API thật: API phải đang chạy và đã có dữ
      # liệu, nếu không trang sinh ra sẽ thiếu.
      - name: Generate
        working-directory: fe
        env:
          NUXT_PUBLIC_API_BASE: ${{ vars.NUXT_PUBLIC_API_BASE }}
          NUXT_PUBLIC_SITE_URL: ${{ vars.NUXT_PUBLIC_SITE_URL }}
        run: |
          pnpm install --frozen-lockfile
          pnpm generate

      # FTP chứ không phải rsync/SSH: shared hosting ở đây không mở SSH, nên
      # đây là kênh ghi file duy nhất có sẵn.
      #
      # `lftp --parallel` thay cho SamKirkland/FTP-Deploy-Action vì action đó
      # đẩy tuần tự từng file một: đo trên run 32118528331 là 829 file, trung
      # vị 1.35s/file gần như không đổi theo kích thước — 9.41 MB mất 24 phút,
      # tức 6.6 KB/s. Nút thắt là round-trip FTP mỗi file, không phải băng
      # thông, nên thứ duy nhất chữa được là mở nhiều kết nối song song.
      #
      # Không cần đồng bộ incremental nữa: mỗi lần build Nuxt sinh `buildId`
      # mới và `prerenderedAt` mới, nên 514/831 file đổi nội dung ngay cả khi
      # nội dung site không đổi. Đẩy song song toàn bộ vừa đơn giản hơn vừa
      # nhanh hơn incremental tuần tự, và bỏ luôn được
      # `.ftp-deploy-sync-state.json` — file liệt kê mọi đường dẫn của site,
      # nằm ngay trong document root.
      #
      # `ftp:ssl-force` là FTP over explicit TLS trên cổng 21 — cùng cổng, cùng
      # tài khoản như FTP thường, chỉ khác là mật khẩu và nội dung được mã hoá.
      # `ssl:verify-certificate no` vì chứng chỉ FTP do hosting cấp thường là
      # self-signed, khác chứng chỉ HTTPS của tên miền.
      #
      # Mật khẩu đi qua biến LFTP_PASSWORD chứ không nằm trên dòng lệnh, nên
      # không lộ trong `ps` và không vỡ nếu có ký tự đặc biệt.
      #
      # `net:max-retries` là bắt buộc chứ không phải cho đẹp: mặc định lftp
      # retry vô hạn, sai host hoặc sai mật khẩu là job treo tới giới hạn 6
      # tiếng. `timeout-minutes` là lưới an toàn thứ hai.
      #
      # `--delete` dọn file build cũ. Hai thư mục loại trừ là do hosting quản,
      # không do build sinh ra — xoá `.well-known/` là mất gia hạn SSL.
      #
      # Dấu `/` cuối đường dẫn nguồn là bắt buộc: copy nội dung bên trong thư
      # mục, không phải cả thư mục. lftp đẩy dotfile mặc định, nên `.htaccess`
      # không bị bỏ quên như khi kéo tay bằng FileZilla.
      - name: Upload
        timeout-minutes: 15
        env:
          FTP_HOST: ${{ secrets.DEPLOY_FTP_HOST }}
          FTP_USER: ${{ secrets.DEPLOY_FTP_USER }}
          LFTP_PASSWORD: ${{ secrets.DEPLOY_FTP_PASSWORD }}
          DEST: ${{ vars.DEPLOY_SITE_PATH }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp <<LFTP
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate no
          set net:max-retries 3
          set net:timeout 15
          set cmd:fail-exit true
          open --env-password -u "$FTP_USER" "$FTP_HOST"
          mirror --reverse --delete --parallel=5 --verbose --exclude '^\.well-known/' --exclude '^cgi-bin/' fe/.output/public/ "$DEST/"
          bye
          LFTP

      - name: Smoke test
        run: |
          set -e
          site="${{ vars.NUXT_PUBLIC_SITE_URL }}"
          curl -fsS -o /dev/null "$site/"
          curl -fsS -o /dev/null "$site/en/"
          curl -fsS -o /dev/null "$site/sitemap.xml"

          # Trang con của admin chỉ tồn tại trong trình duyệt; nếu trả 404 nghĩa
          # là .htaccess không lên tới nơi (file ẩn, rất dễ mất khi upload).
          code=$(curl -s -o /dev/null -w '%{http_code}' "$site/admin/services/1")
          [ "$code" = "200" ] || { echo "::error::.htaccess chưa có trên hosting (SPA fallback hỏng)"; exit 1; }

          # Nén nằm ở .htaccess chứ không ở ứng dụng, nên không có gì khác báo
          # động nếu mất — chỉ là site nặng gấp 6 lần.
          enc=$(curl -fsS -o /dev/null -D - -H 'Accept-Encoding: gzip, br' "$site/" | grep -i '^content-encoding:' || true)
          echo "Home page $enc"
          echo "$enc" | grep -qiE 'gzip|br' || { echo "::error::HTML đang được trả về không nén"; exit 1; }
