name: Publish site

# Chạy tay là chính. Site tĩnh nên nội dung biên tập viên vừa sửa chỉ lên khi
# build lại — bấm "Run workflow" ở tab Actions là đủ, không cần lập trình viên.
on:
  workflow_dispatch:
  push:
    branches: [main]

# Hai lần publish chồng nhau sẽ ghi đè lẫn nhau giữa chừng khi upload, và
# tranh nhau ghi file trạng thái đồng bộ trên hosting.
concurrency:
  group: publish-production
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Build & upload
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: fe/pnpm-lock.yaml

      # Khác với bản SSR trước đây, output chỉ là HTML/CSS/JS — không kèm binary
      # `sharp`, nên không còn ràng buộc phải build đúng kiến trúc máy chủ.
      #
      # Đổi lại, build đọc nội dung từ API thật: API phải đang chạy và đã có dữ
      # liệu, nếu không trang sinh ra sẽ thiếu.
      - name: Generate
        working-directory: fe
        env:
          NUXT_PUBLIC_API_BASE: ${{ vars.NUXT_PUBLIC_API_BASE }}
          NUXT_PUBLIC_SITE_URL: ${{ vars.NUXT_PUBLIC_SITE_URL }}
        run: |
          pnpm install --frozen-lockfile
          pnpm generate

      # FTP chứ không phải rsync/SSH: shared hosting ở đây không mở SSH, nên
      # đây là kênh ghi file duy nhất có sẵn.
      #
      # `protocol: ftps` là FTP over explicit TLS trên cổng 21 — cùng cổng, cùng
      # tài khoản như FTP thường, chỉ khác là mật khẩu và nội dung được mã hoá.
      # Hạ xuống `ftp` là gửi mật khẩu hosting dạng chữ thường qua internet ở
      # mỗi lần chạy; chỉ làm vậy nếu nhà cung cấp thật sự không hỗ trợ TLS.
      #
      # Action giữ một file `.ftp-deploy-sync-state.json` trên hosting để so
      # sánh: lần sau chỉ đẩy file đã đổi và xoá file đã biến mất khỏi bản build
      # — đó là thứ thay cho `rsync --delete`. Lần chạy đầu chưa có file này
      # nên nó upload tất cả và không xoá gì.
      #
      # Dấu `/` cuối `local-dir` là bắt buộc: copy nội dung bên trong thư mục,
      # không phải cả thư mục. Dotfile được đẩy cùng, nên `.htaccess` không bị
      # bỏ quên như khi kéo tay bằng FileZilla.
      - name: Upload
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          protocol: ftps
          server: ${{ secrets.DEPLOY_FTP_HOST }}
          username: ${{ secrets.DEPLOY_FTP_USER }}
          password: ${{ secrets.DEPLOY_FTP_PASSWORD }}
          local-dir: fe/.output/public/
          server-dir: ${{ vars.DEPLOY_SITE_PATH }}/
          # Chứng chỉ do hosting cấp cho FTP thường là self-signed, khác với
          # chứng chỉ HTTPS của tên miền. Bắt buộc hợp lệ thì hầu hết shared
          # hosting sẽ trượt ngay ở bước bắt tay.
          security: loose
          # Do hosting quản, không phải do build sinh ra — dọn đi là mất xác
          # thực SSL và thư mục hệ thống của cPanel.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .well-known/**
            cgi-bin/**

      - name: Smoke test
        run: |
          set -e
          site="${{ vars.NUXT_PUBLIC_SITE_URL }}"
          curl -fsS -o /dev/null "$site/"
          curl -fsS -o /dev/null "$site/en/"
          curl -fsS -o /dev/null "$site/sitemap.xml"

          # Trang con của admin chỉ tồn tại trong trình duyệt; nếu trả 404 nghĩa
          # là .htaccess không lên tới nơi (file ẩn, rất dễ mất khi upload).
          code=$(curl -s -o /dev/null -w '%{http_code}' "$site/admin/services/1")
          [ "$code" = "200" ] || { echo "::error::.htaccess chưa có trên hosting (SPA fallback hỏng)"; exit 1; }

          # Nén nằm ở .htaccess chứ không ở ứng dụng, nên không có gì khác báo
          # động nếu mất — chỉ là site nặng gấp 6 lần.
          enc=$(curl -fsS -o /dev/null -D - -H 'Accept-Encoding: gzip, br' "$site/" | grep -i '^content-encoding:' || true)
          echo "Home page $enc"
          echo "$enc" | grep -qiE 'gzip|br' || { echo "::error::HTML đang được trả về không nén"; exit 1; }
