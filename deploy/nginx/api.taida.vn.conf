# JSON API — Laravel 13 on PHP-FPM.
#
# Lives on its own subdomain of taida.vn so the Sanctum session cookie
# (SESSION_DOMAIN=.taida.vn) is shared with www and the admin SPA can
# authenticate with cookies instead of tokens.

server {
    listen 80;
    listen [::]:80;
    server_name api.taida.vn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://api.taida.vn$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.taida.vn;

    root /var/www/taida/api/current/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/api.taida.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.taida.vn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/taida-compression.conf;
    include /etc/nginx/snippets/taida-brotli.conf;
    include /etc/nginx/snippets/taida-security-headers.conf;

    charset utf-8;

    # MediaRequest allows up to 8 MB per upload; leave headroom for the
    # multipart envelope. PHP's upload_max_filesize / post_max_size must be at
    # least this high or the request dies before Laravel validates it.
    client_max_body_size 10m;

    access_log /var/log/nginx/taida-api.access.log;
    error_log  /var/log/nginx/taida-api.error.log;

    # Uploaded media, reached through the public/storage symlink. These are
    # content-addressed by their stored filename, so they never change in place.
    location /storage/ {
        # One header, not `expires` plus an override that contradicts it.
        add_header Cache-Control "public, max-age=2592000" always;
        include /etc/nginx/snippets/taida-security-headers.conf;
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO       $fastcgi_path_info;
        fastcgi_param HTTPS           on;
        fastcgi_hide_header X-Powered-By;
        # Uploads of several MB take longer than the 60s default on a small box.
        fastcgi_read_timeout 120s;
        # index.php is the only entry point; anything else ending in .php is an
        # upload that must never execute.
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}
