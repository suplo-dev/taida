# Shared proxy settings for the Nitro upstream.

proxy_http_version 1.1;
# Required for the keepalive pool on the upstream to actually be used.
proxy_set_header Connection        "";

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
# Nuxt builds canonical and hreflang URLs from NUXT_PUBLIC_SITE_URL, but
# @nuxtjs/seo also reads these when resolving the current request.
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;

# SSR that waits on the API can legitimately take a few seconds on a cold
# SWR entry; the 60s default just turns a slow page into a 504.
proxy_connect_timeout 5s;
proxy_send_timeout    30s;
proxy_read_timeout    30s;

# Nitro already sets Cache-Control per route rule — nginx must not add its own
# buffering-driven behaviour on top.
proxy_buffering on;
proxy_buffers   16 16k;
proxy_busy_buffers_size 32k;
