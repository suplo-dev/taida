# Headers Lighthouse "Best Practices" and a basic security review look for.
# Kept deliberately small: no CSP, because the admin editor and the OG image
# renderer both use inline styles and a wrong CSP breaks the site silently.

add_header X-Content-Type-Options   "nosniff"                     always;
add_header X-Frame-Options          "SAMEORIGIN"                  always;
add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;
# 2 years + preload once you are sure every subdomain is on HTTPS.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
