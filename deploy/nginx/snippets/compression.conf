# Compression for dynamic responses.
#
# `nitro.compressPublicAssets` in fe/nuxt.config.ts only writes .gz/.br files
# next to the static bundles — the SSR HTML itself is generated per request and
# leaves Nitro uncompressed (~41 KB vs ~8 KB gzipped on the home page). That is
# the reverse proxy's job, and skipping it costs roughly 10 Lighthouse points.
#
# Include this inside every `server` block that serves HTML or JSON.

gzip              on;
gzip_vary         on;
gzip_comp_level   6;
# Below ~1 KB the header overhead outweighs the saving.
gzip_min_length   1024;
# Nitro sits behind us, so responses arrive proxied — without this nginx skips
# them entirely.
gzip_proxied      any;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/ld+json
    application/xml
    application/rss+xml
    application/manifest+json
    image/svg+xml
    font/ttf
    font/otf;
# text/html is always compressed by nginx and must not be listed again.

# Serve the .gz files Nitro emitted at build time instead of re-compressing
# every asset on every request.
gzip_static       on;
