# Brotli — optional, roughly 15–20% smaller than gzip on HTML and JS.
#
# Requires the module, which is NOT part of a stock nginx build:
#
#   apt install libnginx-mod-http-brotli-filter libnginx-mod-http-brotli-static
#
# On Debian/Ubuntu that package drops the `load_module` lines into
# /etc/nginx/modules-enabled automatically. If the module is missing, nginx
# refuses to start with "unknown directive brotli" — in that case delete the
# `include .../brotli.conf;` lines from the server blocks. gzip alone already
# covers the important part.

brotli            on;
brotli_comp_level 5;
brotli_min_length 1024;
brotli_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/ld+json
    application/xml
    application/rss+xml
    application/manifest+json
    image/svg+xml;

# Serves the .br files produced by `nitro.compressPublicAssets`.
brotli_static     on;
