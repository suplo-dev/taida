# Public site — Nuxt 4 SSR running on the Nitro node server.
#
# Static bundles are served straight off disk by nginx (pre-compressed by the
# build); everything else falls through to Nitro, which does the SSR and holds
# the SWR cache configured in fe/nuxt.config.ts routeRules.

upstream taida_nitro {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Canonical host. taida.vn and http:// both redirect here so a page never has
# two indexable URLs.
server {
    listen 80;
    listen [::]:80;
    server_name taida.vn www.taida.vn;

    # Certbot writes its challenge files here; it must stay on plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.taida.vn$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name taida.vn;

    ssl_certificate     /etc/letsencrypt/live/taida.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/taida.vn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    return 301 https://www.taida.vn$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.taida.vn;

    root /var/www/taida/web/current/.output/public;

    ssl_certificate     /etc/letsencrypt/live/taida.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/taida.vn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/taida-compression.conf;
    include /etc/nginx/snippets/taida-brotli.conf;
    include /etc/nginx/snippets/taida-security-headers.conf;

    # SSR pages are small; the 8 MB default would only ever mask a bug.
    client_max_body_size 2m;

    access_log /var/log/nginx/taida-web.access.log;
    error_log  /var/log/nginx/taida-web.error.log;

    # Content-hashed bundles — safe to cache forever.
    location /_nuxt/ {
        # `expires` would emit a second, conflicting Cache-Control header, so
        # the whole policy is set here in one place.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/taida-security-headers.conf;
        access_log off;
        try_files $uri =404;
    }

    # @nuxt/image transforms. Nitro generates these, and its own cache headers
    # are already correct, so just pass them through.
    location /_ipx/ {
        proxy_pass http://taida_nitro;
        include /etc/nginx/snippets/taida-proxy.conf;
    }

    # Anything else that exists as a real file (favicon, /images/*, robots.txt
    # if it were static) is served from disk; the rest goes to Nitro.
    location / {
        try_files $uri @nitro;
    }

    location @nitro {
        proxy_pass http://taida_nitro;
        include /etc/nginx/snippets/taida-proxy.conf;
    }

    # The CMS is behind Sanctum, but keeping crawlers off it saves a pointless
    # round trip. robots.txt already disallows it.
    location /admin {
        add_header X-Robots-Tag "noindex, nofollow" always;
        include /etc/nginx/snippets/taida-security-headers.conf;
        try_files $uri @nitro;
    }
}
